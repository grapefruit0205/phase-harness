[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-harness"
version = "2.0.0"
description = "A small, dependency-free two-role phase runner"
requires-python = ">=3.11"

[project.scripts]
phase-harness = "phase_harness.cli:main"

[tool.setuptools.package-data]
phase_harness = ["agent-result.schema.json"]
